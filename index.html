<style>

.bx{padding:10px;max-height:290px;overflow:auto}
.br{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer;padding:1px 3px;border-radius:4px}.br.on{background:#cfe8e4;outline:1px solid var(--g)}

td{padding:5px 8px;border-bottom:1px solid #d5dada;white-space:nowrap}tr:nth-child(even) td{background:#f1f4f4}
.REGULAR{color:var(--ok);font-weight:700}.VENCIDO{color:var(--bad);font-weight:700}.PROGRAMAR{color:#b38f00;font-weight:700}
.tt{display:flex;gap:6px;margin:14px 0 8px}.tt button{background:#cfd8d7}.tt button.on{background:var(--g);color:#fff}
.pad{padding:10px 14px}.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.cg div{border:1px solid #cdd6d5;border-radius:8px;padding:8px;text-align:center}.cg b{font-size:26px;display:block}
#dz{padding:40px;text-align:center;font-size:20px;color:var(--g)}.emb header .hb{display:none}.emb header{padding:6px 14px}.emb h1{font-size:20px}
.sub{font-size:13px;color:#555;margin:2px 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}.pad button{background:var(--g);color:#fff}.bar select{padding:5px;border-radius:4px}
.cg div.k{cursor:pointer;border:2px solid #cdd6d5}.cg div.k.on{border-color:var(--g);background:#e4f1ef}.cg div.k b{font-size:30px}
.sb{display:flex;align-items:center;gap:8px;margin:6px 0}.sb>span{flex:0 0 56px;font-weight:700}.sb>div{flex:1;display:flex;height:32px;border-radius:5px;overflow:hidden;background:#eee}
.sb i{display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:#fff;font-size:13px;overflow:hidden}
.mx{border-collapse:separate;border-spacing:4px;width:auto}.mx td,.mx th{text-align:center;padding:10px 16px;border-radius:6px;position:static;border:0}.mx th{background:#fff;color:var(--tx);cursor:default}
.mx th.REGULAR{color:var(--ok)}.mx th.VENCIDO{color:var(--bad)}.mx th.PROGRAMAR{color:#b38f00}.mx td{cursor:pointer;font-size:22px;font-weight:700}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin:12px 0}.two h4,.pad h4{margin:6px 0}
.gb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}.gb .bl{flex:0 0 140px;text-align:right;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gb .bt{flex:1}.gb .bt i{height:10px;margin:1px 0}.gb em{flex:0 0 64px;font-style:normal;font-weight:700}
.tg{padding:2px 9px;border-radius:10px;color:#fff;font-weight:700;font-size:12px}.lg i{display:inline-block;width:12px;height:12px;margin:0 4px 0 10px;vertical-align:middle}
.card{border:1px solid #c9d3d2}.fl{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 2px;margin-bottom:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:10px;font-size:14px}.pl{padding:2px 10px;border-radius:10px;color:#fff;font-weight:700;font-size:12px;margin-right:6px}.pl.a{background:#7b8786}.pl.h{background:var(--g)}
.vd{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;padding:14px 18px;border-radius:10px;border-left:8px solid #9aa5a4;background:#f1f4f4;margin-bottom:12px}.vd.ok{border-color:var(--ok);background:#e8f5ea}.vd.bad{border-color:var(--bad);background:#fbeaec}
.vd b{font-size:44px;line-height:1;white-space:nowrap}.vd small{display:block;font-weight:600}.vt{font-size:19px;font-weight:700}.vt span{font-size:14px;font-weight:400;color:#555}
.kr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px}.kc{border:1px solid #cdd6d5;border-radius:10px;padding:10px 14px}.kc>span{font-weight:700;color:#555}
.kv{display:flex;align-items:baseline;gap:8px}.kv em{font-style:normal;font-size:22px;color:#7b8786}.kv b{font-size:34px}.kv i{font-style:normal;color:#9aa5a4}
.wf{display:flex;gap:8px;align-items:flex-end;padding-top:22px}.wc{flex:1;text-align:center;font-size:11px;font-weight:600}.wb{position:relative;height:190px;border-bottom:1px solid #9aa5a4;margin-bottom:4px}.wb i{position:absolute;left:12%;right:12%;border-radius:3px 3px 0 0}.wb u{position:absolute;left:0;right:0;text-decoration:none;font-size:15px;font-weight:700}
.dv{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:12px}.dv .bl{flex:0 0 130px;text-align:right;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dv .h{flex:1;display:flex;height:16px}.dv .h>div{flex:1;display:flex}.dv .h>div:first-child{justify-content:flex-end;border-right:1px solid #7b8786}.dv .h i{display:block;height:100%}.dv em{flex:0 0 110px;font-style:normal;font-weight:700}
.pad button.ch{background:#e3e9e8;color:var(--tx);padding:5px 12px;border-radius:16px}.pad button.ch.on{background:var(--g);color:#fff}.ch b{margin-left:6px}
#p2.card{background:none;border:0;padding:0;overflow:visible}#p2>.bar{background:#fff;border:1.5px solid #b4c7c4;border-radius:16px;padding:10px 18px;margin-bottom:16px}
.pn{background:#fff;border:1.5px solid #b4c7c4;border-radius:16px;padding:18px 22px;display:flex;flex-direction:column;min-width:0}.pn h4{margin:0 0 4px;font-size:17px}.pn .sub{margin:0 0 14px}.pn .bar{margin-bottom:6px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0 0 16px}@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.pills{margin:0 0 12px 4px}.vd{border-radius:16px;margin-bottom:16px;padding:16px 22px}.kr{gap:16px;margin-bottom:16px}.kc{background:#fff;border:1.5px solid #b4c7c4;border-radius:16px;padding:14px 20px}
.mx{margin:auto}.wf{flex:1;align-items:stretch;padding-top:26px}.wc{display:flex;flex-direction:column;justify-content:flex-end}.wb{flex:1;min-height:190px}.wb i{left:14%;right:14%;bottom:0}
.pn .tw{border:1px solid #d5dada;border-radius:10px}
.pn{padding:0;overflow:hidden}.pn>h4{background:var(--g2);color:#fff;text-align:center;margin:0;padding:9px 14px;font-size:16px;font-weight:700;text-transform:uppercase}
.pn>h4 select{text-transform:none;font-size:13px;margin-left:6px;padding:2px 4px;border:0;border-radius:4px}.pb{flex:1;display:flex;flex-direction:column;padding:16px 22px 20px;min-width:0}
</style></head><body>
<header><div class="st hb" id="st">Nenhuma planilha carregada</div><h1>PCM - VEÍCULOS LEVES LOCADOS</h1>
<div class="hb"><button id="op">Abrir planilha (monitorar)</button> <input type="file" id="fi" accept=".xlsx,.xlsm" hidden></div></header>
<div id="dz" class="card">Abra ou arraste aqui a planilha <b>PCM_LEVES</b> (.xlsx).<br><small>Em Chrome/Edge, o botão acima passa a monitorar o arquivo e atualiza o painel a cada gravação.</small></div>
<main id="app" hidden>
<div class="fl" id="fl"></div>
<div class="tt"><button id="t2" class="on">Comparativo: antes × hoje</button><button id="t1">Frota atual</button></div>
<div class="card pad" id="p2"><div class="bar"><label><b>Antes:</b> <select id="bs"></select></label><button id="lb">Carregar planilha antiga</button><span class="sub" id="bi"></span><input type="file" id="bf" accept=".xlsx,.xlsm" hidden></div><div id="cmp"></div></div>
<div id="p1" hidden><div class="card kp" id="kp"></div><div class="gr"><div class="card"><h3>STATUS</h3><div class="bx" id="c1"></div></div>
<div class="card"><h3>VEÍCULOS POR REGIONAL</h3><div class="bx" id="c2"></div></div>
<div class="card"><h3>VEÍCULOS POR CENTRO DE CUSTO</h3><div class="bx" id="c3"></div></div></div>
<div class="card"><div class="tw"><table id="tb"></table></div></div></div>
</main>
<script>
const CONFIG={src:'PCM_LEVES_13_03.xlsx',every:60,main:'LEVES ATUALIZADO',base:'COPIA ATUALIZADO'};
const $=s=>document.querySelector(s),Q=new URLSearchParams(location.search),RK={REGULAR:0,PROGRAMAR:1,VENCIDO:2};
const COL={REGULAR:'#1a9a2c',VENCIDO:'#d9434f',PROGRAMAR:'#e6e000'},K='pcm_snaps_v1';
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const num=v=>{const n=typeof v==='number'?v:parseFloat(String(v).replace(',','.'));return isFinite(n)?n:NaN};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=s=>String(s??'').trim()||'A DEFINIR',nf=n=>isNaN(n)?'':Math.round(n).toLocaleString('pt-BR');
const fd=v=>{if(typeof v!=='number')return v||'';if(v<2)return'';const d=new Date(Math.round((v-25569)*864e5)).toISOString();return d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4)};
const hs=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h};
const SR='SEM RESPONSÁVEL',RS=v=>{v=String(v??'').trim();return!v||norm(v)==='A DEFINIR'?SR:v};
let D=[],SH=null,BF=null,BFN='',CF='todos',GK='reg',CR=[],SRC='',AT=new Date(),FH=null,LM=0,SIG='',S={c:'kr',d:1};
const F={resp:'',reg:'',cc:'',modelo:'',status:'',placa:''};
for(const k in F)if(Q.has(k))F[k]=Q.get(k);
if(Q.get('embed')==='1')document.body.classList.add('emb');

function toRows(ws){if(!ws['!ref'])return[];const r=XLSX.utils.decode_range(ws['!ref']);r.e.r=Math.min(r.e.r,6000);ws['!ref']=XLSX.utils.encode_range(r);
return XLSX.utils.sheet_to_json(ws,{defval:''}).map(x=>{const o={};for(const k in x){const n=norm(k);if(!(n in o))o[n]=x[k]}
const pl=norm(o.PLACA);if(!pl)return null;const ka=num(o['KM ATUAL']),ku=num(o['KM ULTIMA TROCA']);let kr=num(o['KM PARA REVISAO']);
if(isNaN(kr))kr=(num(o['ORIENTACAO LOCADORA'])||10000)-(ka-ku);if(isNaN(kr))return null;
return{placa:pl,modelo:T(o.MODELO),cc:T(o['CENTRO DE CUSTO']),reg:T(o.REGIONAL),sub:T(o['SUB REGIONAL']),loc:T(o.LOCADORA),ka,ku,dt:o['DT ULTIMA TROCA'],kr,resp:RS(o.RESPONSAVEL),ag:String(o.AGENDADO||'').trim(),status:kr<0?'VENCIDO':kr<1000?'PROGRAMAR':'REGULAR'}}).filter(Boolean)}
const pickSheet=(wb,k)=>wb.SheetNames.find(n=>norm(n).includes(norm(k)));
const bestRows=wb=>{const n=pickSheet(wb,CONFIG.main);if(n){const r=toRows(wb.Sheets[n]);if(r.length)return r}return wb.SheetNames.map(x=>toRows(wb.Sheets[x])).sort((a,b)=>b.length-a.length)[0]||[]};
function load(buf,name){const wb=XLSX.read(buf,{type:'array'});D=bestRows(wb);
const b=pickSheet(wb,CONFIG.base);SH=b?toRows(wb.Sheets[b]):null;SRC=name;AT=new Date();snap();$('#dz').hidden=true;$('#app').hidden=false;fill();render()}

const snaps=()=>{try{return JSON.parse(localStorage.getItem(K))||[]}catch(e){return[]}};
function snap(){const s=snaps(),sig=hs(D.map(r=>r.placa+r.kr).join('|'));if(s.length&&s[s.length-1].sig===sig)return;
s.push({t:Date.now(),sig,rows:D.map(r=>[r.placa,r.modelo,r.cc,r.reg,r.resp,r.kr,r.ku,typeof r.dt==='number'?r.dt:0,r.ka])});try{localStorage.setItem(K,JSON.stringify(s.slice(-40)))}catch(e){}}
const fromSnap=s=>s.rows.map(a=>({placa:a[0],modelo:a[1],cc:a[2],reg:a[3],resp:RS(a[4]),kr:a[5],ku:a[6],dt:a[7],ka:a[8],status:a[5]<0?'VENCIDO':a[5]<1000?'PROGRAMAR':'REGULAR'}));

const FL=[['resp','Responsável'],['reg','Regional'],['cc','Centro de custo'],['modelo','Modelo'],['status','Status'],['placa','Placa']];
function fill(){$('#fl').innerHTML=FL.map(([k,l])=>k==='placa'?`<div><label>${l}</label><input id="f_${k}" value="${esc(F[k])}" placeholder="Todas"></div>`:
`<div><label>${l}</label><select id="f_${k}"><option value="">Todos</option>${[...new Set(D.map(r=>r[k]))].sort((a,b)=>a===SR?-1:b===SR?1:a<b?-1:a>b?1:0).map(v=>`<option${F[k]===v?' selected':''}>${esc(v)}</option>`).join('')}</select></div>`).join('');
FL.forEach(([k])=>$('#f_'+k).oninput=e=>{F[k]=e.target.value;render()});
const s=snaps().slice(0,-1);const pv=$('#bs').value;$('#bs').innerHTML=(SH?'<option value="sheet">Aba de referência da planilha</option>':'')+s.map((x,i)=>`<option value="s${i}">Histórico salvo em ${new Date(x.t).toLocaleString('pt-BR')}</option>`).join('')+'<option value="file">'+(BF?'Planilha antiga carregada':'Outro arquivo…')+'</option>'+'<option value="none">Sem comparação</option>';if([...$('#bs').options].some(o=>o.value===pv))$('#bs').value=pv}
const ap=rs=>rs.filter(r=>(!F.resp||r.resp===F.resp)&&(!F.reg||r.reg===F.reg)&&(!F.cc||r.cc===F.cc)&&(!F.modelo||r.modelo===F.modelo)&&(!F.status||r.status===F.status)&&(!F.placa||r.placa.includes(F.placa.toUpperCase())));
function getBase(){const v=$('#bs').value;if(v==='sheet')return SH;if(v==='file')return BF;if(v[0]==='s')return fromSnap(snaps()[+v.slice(1)]);return null}
const st=rs=>{const n=rs.length,c=x=>rs.filter(r=>r.status===x).length,v=c('VENCIDO');return{n,reg:c('REGULAR'),prog:c('PROGRAMAR'),venc:v,pct:n?(n-v)/n*100:0}};
const cnt=(rs,k)=>rs.reduce((a,r)=>(a[r[k]]=(a[r[k]]||0)+1,a),{});
let cur=[],base=null;
function dl(a,b,bad,dec){if(b==null)return'';const d=a-b;if(!d)return'<small>= sem mudança</small>';return`<small class="${(d>0)===!bad?'g':'r'}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(dec||0)} vs. antes</small>`}
function bars(id,k,order){const c=cnt(cur,k),b=base?cnt(base,k):null;const ks=order||[...new Set([...Object.keys(c),...Object.keys(b||{})])].sort((x,y)=>(c[y]||0)-(c[x]||0));
const mx=Math.max(1,...ks.map(x=>Math.max(c[x]||0,b?b[x]||0:0)));
$(id).innerHTML=ks.map(x=>`<div class="br${F[k]===x?' on':''}" data-k="${k}" data-v="${esc(x)}"><span class="bl" title="${esc(x)}">${esc(x)}</span><div class="bt"><i style="width:${(c[x]||0)/mx*100}%;background:${COL[x]||'#3fa3f5'}"></i>${b?`<i class="pv" style="width:${(b[x]||0)/mx*100}%"></i>`:''}</div><b>${c[x]||0}</b></div>`).join('');
$(id).querySelectorAll('.br').forEach(e=>e.onclick=()=>{const v=e.dataset.v;F[k]=F[k]===v?'':v;$('#f_'+k).value=F[k];render()})}
function render(){cur=ap(D);base=getBase();base=base&&ap(base);const s=st(cur),b=base&&st(base);
$('#st').textContent=`${SRC} • atualizado ${AT.toLocaleTimeString('pt-BR')}${FH?' • monitorando':''}`;
$('#kp').innerHTML=`<div><span>FROTA TOTAL</span><b>${s.n}</b>${dl(s.n,b&&b.n,0)}</div><div><span>% DE REVISÃO EM DIA</span><b>${s.pct.toFixed(2).replace('.',',')}%</b>${dl(s.pct,b&&b.pct,0,2)}</div><div><span>REVISÕES VENCIDAS</span><b style="color:var(--bad)">${s.venc}</b>${dl(s.venc,b&&b.venc,1)}</div><div><span>A PROGRAMAR (&lt;1.000 km)</span><b style="color:#b38f00">${s.prog}</b>${dl(s.prog,b&&b.prog,1)}</div>`;
bars('#c1','status',['REGULAR','VENCIDO','PROGRAMAR']);bars('#c2','reg');bars('#c3','cc');table();cmp();
if(parent!==window)parent.postMessage({type:'pcm-revisoes:kpis',frota:s.n,regular:s.reg,programar:s.prog,vencidos:s.venc,emDiaPct:+s.pct.toFixed(2),atualizadoEm:AT.toISOString()},'*')}
const COLS=[['placa','PLACA'],['reg','REGIONAL'],['cc','CENTRO DE CUSTO'],['loc','LOCADORA'],['sub','SUB REGIONAL'],['ka','KM ATUAL'],['dt','DT ÚLTIMA TROCA'],['ku','KM ÚLTIMA TROCA'],['kr','KM PARA REVISÃO'],['status','STATUS'],['resp','RESPONSÁVEL'],['ag','AGENDAMENTO']];
function table(){const rs=[...cur].sort((a,b)=>(a[S.c]>b[S.c]?1:a[S.c]<b[S.c]?-1:0)*S.d);
$('#tb').innerHTML='<tr>'+COLS.map(([k,l])=>`<th data-k="${k}">${l}${S.c===k?(S.d>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>'+rs.slice(0,400).map(r=>'<tr>'+COLS.map(([k])=>`<td${k==='status'?` class="${r.status}"`:''}>${k==='dt'?fd(r.dt):['ka','ku','kr'].includes(k)?nf(r[k]):esc(r[k])}</td>`).join('')+'</tr>').join('')+(rs.length>400?`<tr><td colspan="12">Mostrando 400 de ${rs.length}. Use os filtros.</td></tr>`:'');
$('#tb').querySelectorAll('th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;S.d=S.c===k?-S.d:1;S.c=k;table()})}
const LB={rev:'Revisão realizada',venc:'Passou a vencido',prog:'Passou a programar',melh:'Melhorou',novo:'Novo na frota',saiu:'Saiu da frota',sem:'Sem alteração'},TC={rev:'#2a74c9',venc:'#d9434f',prog:'#d4a900',melh:'#1a9a2c',novo:'#0b5a52',saiu:'#777',sem:'#9aa5a4'},PR={venc:0,prog:1,rev:2,melh:3,novo:4,saiu:5,sem:6},SK={REGULAR:'reg',PROGRAMAR:'prog',VENCIDO:'venc'},GL={reg:'Regional',cc:'Centro de custo',resp:'Responsável',modelo:'Modelo'},ST3=['REGULAR','PROGRAMAR','VENCIDO'];
function cmp(){const el=$('#cmp');
if(!base){el.innerHTML='<div id="dz" style="padding:30px">Carregue a <b>planilha antiga</b> (botão acima) para comparar com a planilha atual.</div>';return}
const bm=new Map(base.map(r=>[r.placa,r])),cm=new Map(cur.map(r=>[r.placa,r])),a=st(base),h=st(cur);
const R=cur.map(r=>{const o=bm.get(r.placa);let c;if(!o)c='novo';else if(Number.isFinite(o.ku)&&r.ku>o.ku)c='rev';else if(r.status==='VENCIDO'&&o.status!=='VENCIDO')c='venc';else if(RK[r.status]>RK[o.status])c='prog';else if(RK[r.status]<RK[o.status])c='melh';else c='sem';return{r,o,c}}).concat(base.filter(o=>!cm.has(o.placa)).map(o=>({r:null,o,c:'saiu'})));
